name: macOS build

# Baut die Mac-Fassung auf einem Mac-Rechner von GitHub und hängt sie an das
# Release, sobald eines veröffentlicht wird. Von Hand startbar mit Angabe des Tags.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, an das die .dmg-Dateien sollen (z. B. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: Bauen
        run: pnpm exec electron-vite build

      - name: Paket (.dmg, Apple Silicon und Intel)
        run: pnpm exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: An das Release hängen
        run: gh release upload "$TAG" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
